# Invictus plain path: Atrium desktop, Custodia guard rails, hostname made
# from the user name (the field is hidden). installer/jobs/settings.sh
---
dontChroot: true
timeout: 60
script:
    - "/usr/lib/invictus/installer/settings.sh ${ROOT} ${USER} atrium custodia --hostname-from-user"
i18n:
    name: "Setting up your account"
