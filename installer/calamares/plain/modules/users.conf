# Invictus users (plain path). The person is the administrator of their own
# machine (DS1): in wheel, sudo with their own password, no NOPASSWD.
# Root stays locked: setRootPassword false hides the root fields, and the
# cleanup job locks the account (the live image's root has no password).
# kvm for rootless podman with /dev/kvm (design 2.2).
---
defaultGroups:
    - name: users
      must_exist: true
      system: true
    - name: wheel
      must_exist: true
      system: true
    - audio
    - video
    - input
    - storage
    - network
    - name: kvm
      must_exist: false
      system: true
sudoersGroup: wheel
sudoersConfigureWithGroup: false
# Required key; there is no autologin on an installed machine.
autologinGroup: autologin
setRootPassword: false
doReusePassword: false
doAutologin: false
displayAutologin: false
passwordRequirements:
    minLength: 4
    maxLength: -1
allowWeakPasswords: true
allowWeakPasswordsDefault: true
user:
    shell: /bin/zsh
    forbidden_names: [ root, liber ]
    home_permissions: "o700"
hostname:
    # Hidden on the plain path (Venus 3.1): the settings job names the
    # machine <user>-invictus.
    location: None
    writeHostsFile: false
presets:
    fullName:
        editable: true
    loginName:
        editable: true
