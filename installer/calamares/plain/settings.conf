# The plain path (Atrium desktop, Custodia guard rails): the one Venus
# designed for friends (simple-mode.md 3.1). Language, time zone, keyboard,
# the Extras page (office ticked; installed from the internet, or on the
# first start with internet), name and password, then the disk and the
# "I've saved my files" tick box,
# which is the last page before anything is written.
#
# The launcher (installer/live/invictus-install) puts common/modules and
# this folder's modules together in /etc/calamares.
---
modules-search: [ local ]

instances:
    - id: invictus-cleanup
      module: shellprocess
      config: shellprocess@invictus-cleanup.conf
    - id: invictus-settings
      module: shellprocess
      config: shellprocess@invictus-settings.conf
    - id: invictus-bootloader
      module: shellprocess
      config: shellprocess@invictus-bootloader.conf
    - id: invictus-snapper
      module: shellprocess
      config: shellprocess@invictus-snapper.conf


sequence:
  - show:
    - welcome
    - locale
    - keyboard
    - netinstall
    - users
    - partition
    - diskcheck
  - exec:
    - partition
    - mount
    - unpackfs
    - machineid
    - shellprocess@invictus-cleanup
    - fstab
    - locale
    - keyboard
    - localecfg
    - users
    - networkcfg
    - hwclock
    - shellprocess@invictus-settings
    - initcpiocfg
    - services-systemd
    - shellprocess@invictus-bootloader
    - invictusextras
    - shellprocess@invictus-snapper
    - umount
  - show:
    - finished

branding: invictus
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
