# Invictus Advanced path: desktop flavor for the new account (Alex,
# 2026-09-30). Switchable later in Settings; the installer only sets the
# default. The settings job reads packagechooser_flavor.
---
mode: required
method: legacy
labels:
    step: "Desktop"
default: atrium
items:
    - id: atrium
      name: "Atrium"
      description: "Windows fill the screen, with a taskbar and Start. Nothing needs a keyboard shortcut."
      screenshot: "flavor-atrium.png"
    - id: tessera
      name: "Tessera"
      description: "Windows share the screen side by side (tiling). Uses keyboard shortcuts."
      screenshot: "flavor-tessera.png"
