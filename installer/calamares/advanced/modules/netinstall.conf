# Invictus: the Extras page, Advanced path (Alex, 2026-09-30: "Keep the
# ISO small and offer those different packages in the install wizard").
# The plain path has its own copy without Programming
# (plain/modules/netinstall.conf); keep the shared groups word for word
# the same (tests/iso/calamares.py checks).
#
# What is here is not on the ISO. Calamares' netinstall module draws the
# page from the groups below (nothing is downloaded to draw it) and only
# records the ticks; installer/modules/invictusextras hands them to
# installer/jobs/extras.sh, which installs them from our signed repo when
# there is internet and otherwise leaves them for the first start that has
# internet (invictus-extras.service). The install finishes either way.
#
# Design (Venus, 2026-10-01, docs/simple-mode.md 3.1.1):
#  - Each visible group holds its packages in a hidden, selected subgroup.
#    A group with only hidden children has no expand arrow, so nobody sees
#    a package name; the hidden subgroup installs when its parent is ticked
#    (Calamares 3.4.2 PackageTreeItem::hiddenSelected).
#  - Group names are the Start tile names (Documents, Games), so what was
#    ticked here is what shows up in Start.
#  - The title is one line: Calamares' title label does not wrap
#    (page_netinst.ui), so it stays under 100 characters.
#  - Documents is ticked on both paths and both flavors: a flavor is how
#    windows behave, not what the person needs.
#
# Only names in scripts/lib/extras.list are ever installed this way
# (tests/iso/calamares.py checks the two agree). No group is critical:
# a missing extra never stops the install.
---
groupsUrl: local
required: false
label:
    sidebar: "Extras"
    title: "Tick any you want. They download during the install, or the first time you're online."
groups:
    - name: "Documents"
      description: "Letters, budgets and slides. Opens Word, Excel and PowerPoint files."
      selected: true
      critical: false
      subgroups:
          - name: "invictus-office"
            description: "LibreOffice and its fonts"
            hidden: true
            selected: true
            critical: false
            packages:
                - invictus-office
    - name: "Games"
      description: "Steam and Proton for Windows games. Lutris for GOG and Epic."
      selected: false
      critical: false
      subgroups:
          - name: "invictus-gaming"
            description: "Steam, Proton and Lutris"
            hidden: true
            selected: true
            critical: false
            packages:
                - invictus-gaming
    - name: "Programming"
      description: "VS Code, Zed, Git, Node.js, Python and containers."
      selected: false
      critical: false
      subgroups:
          - name: "invictus-dev"
            description: "The developer set"
            hidden: true
            selected: true
            critical: false
            packages:
                - invictus-dev
    - name: "Chinese, Japanese and Korean text"
      description: "Shows these languages on web pages and in documents."
      selected: false
      critical: false
      subgroups:
          - name: "noto-fonts-cjk"
            description: "Noto CJK fonts"
            hidden: true
            selected: true
            critical: false
            packages:
                - noto-fonts-cjk
