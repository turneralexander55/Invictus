# Invictus Advanced path: the flavor and guard rails picked on the two
# packagechooser pages. installer/jobs/settings.sh
---
dontChroot: true
timeout: 60
script:
    - "/usr/lib/invictus/installer/settings.sh ${ROOT} ${USER} ${gs[packagechooser_flavor]} ${gs[packagechooser_guardrails]}"
i18n:
    name: "Setting up your account"
