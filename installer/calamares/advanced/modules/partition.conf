# Invictus disk layout (advanced path). UEFI only (D5), GPT, a 4 GiB FAT32 ESP at
# /boot (limine-snapper-sync copies kernels per snapshot into it, design
# 2.2), btrfs for everything else with the subvolumes in mount.conf, and a
# swap file in @swap.
---
efi:
    mountPoint: "/boot"
    recommendedSize: 4GiB
    minimumSize: 1GiB
    label: "EFI"
userSwapChoices:
    - none
    - file
initialSwapChoice: file
initialPartitioningChoice: erase
defaultFileSystemType: "btrfs"
availableFileSystemTypes: [ "btrfs" ]
drawNestedPartitions: false
alwaysShowPartitionLabels: true
showNotEncryptedBootMessage: false
# Device-mapper names never closed or offered as a target: the live medium
# and a Ventoy stick.
essentialMounts: [ "live-*", "control", "ventoy" ]
lvm:
    enable: false
requiredStorage: 40
# Advanced path: manual partitioning and encryption offered, encryption
# unticked by default (D6). The ESP must still be FAT32 at /boot and / must
# be btrfs; the bootloader job refuses anything else.
allowManualPartitioning: true
enableLuksAutomatedPartitioning: true
luksGeneration: luks2
preCheckEncryption: false
