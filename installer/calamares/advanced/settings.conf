# The Advanced path (Alex, Tessera users): pick the desktop flavor and the
# guard rails, partition by hand, encryption offered (off by default, D6).
# Started with invictus-install --advanced, the "Install Invictus (Advanced)"
# launcher entry, or the Advanced boot menu entry.
#
# The launcher (installer/live/invictus-install) puts common/modules and
# this folder's modules together in /etc/calamares.
---
modules-search: [ local ]

instances:
    - id: invictus-cleanup
      module: shellprocess
      config: shellprocess@invictus-cleanup.conf
    - id: invictus-settings
      module: shellprocess
      config: shellprocess@invictus-settings.conf
    - id: invictus-bootloader
      module: shellprocess
      config: shellprocess@invictus-bootloader.conf
    - id: invictus-snapper
      module: shellprocess
      config: shellprocess@invictus-snapper.conf
    - id: flavor
      module: packagechooser
      config: packagechooser@flavor.conf
    - id: guardrails
      module: packagechooser
      config: packagechooser@guardrails.conf

sequence:
  - show:
    - welcome
    - locale
    - keyboard
    - packagechooser@flavor
    - packagechooser@guardrails
    - users
    - partition
    - summary
    - diskcheck
  - exec:
    - partition
    - mount
    - unpackfs
    - machineid
    - shellprocess@invictus-cleanup
    - fstab
    - locale
    - keyboard
    - localecfg
    - users
    - networkcfg
    - hwclock
    - shellprocess@invictus-settings
    - initcpiocfg
    - services-systemd
    - shellprocess@invictus-bootloader
    - shellprocess@invictus-snapper
    - umount
  - show:
    - finished

branding: invictus
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
