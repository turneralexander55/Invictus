# Invictus: Sets up snapper on / with @snapshots and takes snapshot 1.
# Runs on the live system with the target's root as its argument
# (installer/jobs/snapper.sh). A failure stops the install.
---
dontChroot: true
timeout: 600
verbose: true
script:
    - "/usr/lib/invictus/installer/snapper.sh ${ROOT}"
i18n:
    name: "Setting up safety copies"
