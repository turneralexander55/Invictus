# Invictus: Installs limine, builds the initramfs for each kernel, adds the firmware boot entry.
# Runs on the live system with the target's root as its argument
# (installer/jobs/bootloader.sh). A failure stops the install.
---
dontChroot: true
timeout: 900
verbose: true
script:
    - "/usr/lib/invictus/installer/bootloader.sh ${ROOT}"
i18n:
    name: "Setting up start-up"
