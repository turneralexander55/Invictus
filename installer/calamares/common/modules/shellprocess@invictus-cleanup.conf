# Invictus: Removes the live session's user, files and packages, locks root, sets up pacman's keyring.
# Runs on the live system with the target's root as its argument
# (installer/jobs/cleanup-live.sh). A failure stops the install.
---
dontChroot: true
timeout: 600
verbose: true
script:
    - "/usr/lib/invictus/installer/cleanup-live.sh ${ROOT}"
i18n:
    name: "Tidying up the live session"
