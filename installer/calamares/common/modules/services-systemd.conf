# Invictus: what an installed machine starts (docs/packages.md, "For the
# ISO"). snapper-cleanup, snapper-timeline and limine-snapper-sync are
# enabled by the snapper job. sshd is never enabled (design-simple-mode 1.3).
---
units:
    - name: NetworkManager.service
      action: enable
    - name: bluetooth.service
      action: enable
    - name: sddm.service
      action: enable
    - name: power-profiles-daemon.service
      action: enable
    # Printing (invictus-atrium): socket-activated CUPS, mDNS for driverless
    # network printers and scanners.
    - name: cups.socket
      action: enable
    - name: avahi-daemon.service
      action: enable
    - name: paccache.timer
      action: enable
    - name: systemd-timesyncd.service
      action: enable
    - name: fstrim.timer
      action: enable
      mandatory: false
