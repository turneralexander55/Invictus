# Invictus: btrfs subvolumes (design 2.2, design-simple-mode 12.2) and the
# mounts the jobs need.
# Parents are listed before children (Calamares mounts them in list order).
# @vm gets No_COW from the snapper job, not from a mount option: btrfs
# applies nodatacow to the whole file system (build note).
---
extraMounts:
    - device: proc
      fs: proc
      mountPoint: /proc
    - device: sys
      fs: sysfs
      mountPoint: /sys
    - device: /dev
      mountPoint: /dev
      options: [ bind ]
    - device: tmpfs
      fs: tmpfs
      mountPoint: /run
    - device: /run/udev
      mountPoint: /run/udev
      options: [ bind ]
    - device: efivarfs
      fs: efivarfs
      mountPoint: /sys/firmware/efi/efivars
      efi: true
btrfsSubvolumes:
    - mountPoint: /
      subvolume: /@
    - mountPoint: /home
      subvolume: /@home
    # Home snapshots on their own subvolume (design-simple-mode 12.2), so a
    # later whole-home restore never snapshots the snapshots.
    - mountPoint: /home/.snapshots
      subvolume: /@home-snapshots
    - mountPoint: /var/log
      subvolume: /@log
    - mountPoint: /var/cache
      subvolume: /@cache
    - mountPoint: /var/cache/pacman/pkg
      subvolume: /@pkg
    - mountPoint: /.snapshots
      subvolume: /@snapshots
    - mountPoint: /var/lib/invictus/vm
      subvolume: /@vm
btrfsSwapSubvol: /@swap
mountOptions:
    - filesystem: default
      options: [ defaults ]
    - filesystem: efi
      options: [ defaults, umask=0077 ]
    - filesystem: btrfs
      options: [ defaults, noatime, compress=zstd:1 ]
    - filesystem: btrfs_swap
      options: [ defaults, noatime ]
