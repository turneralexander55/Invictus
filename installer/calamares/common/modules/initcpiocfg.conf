# Invictus: systemd hooks (limine-snapper-sync needs sd-btrfs-overlayfs, which
# only works with them). Calamares adds plymouth and sd-encrypt when needed;
# sd-btrfs-overlayfs goes last, after filesystems. The bootloader job checks.
---
useSystemdHook: true
hooks:
    prepend: []
    append: [ sd-btrfs-overlayfs ]
    remove: []
source: "/etc/mkinitcpio.conf"
