# Invictus: Checks the system image is there before the partition job runs, so
# a missing image stops the install before any disk is touched (design note 60).
# Runs on the live system; no ${ROOT} yet, nothing is mounted. A failure stops the install.
---
dontChroot: true
timeout: 30
verbose: true
script:
    - "/usr/lib/invictus/installer/sourcecheck.sh /run/archiso/bootmnt/arch/x86_64/airootfs.sfs"
i18n:
    name: "Checking the installer"
