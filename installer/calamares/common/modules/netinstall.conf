# Invictus: the Extras page, on both install paths (Alex, 2026-09-30:
# "Keep the ISO small and offer those different packages in the install
# wizard"). What is here is not on the ISO. Calamares' netinstall module
# draws the page from the groups below (nothing is downloaded to draw it)
# and only records the ticks; installer/modules/invictusextras hands them
# to installer/jobs/extras.sh, which installs them from our signed repo
# when there is internet and otherwise leaves them for the first start
# that has internet (invictus-extras.service). The install finishes
# either way.
#
# Only names in scripts/lib/extras.list are ever installed this way
# (tests/iso/calamares.py checks the two agree). No group is critical:
# a missing extra never stops the install.
---
groupsUrl: local
required: false
label:
    sidebar: "Extras"
    title: "Extras come from the internet while Invictus installs. No internet right now? The install still finishes, and what you tick here is added the first time Invictus starts with internet."
groups:
    - name: "Office"
      description: "Documents, spreadsheets and slides (LibreOffice). Opens Word, Excel and PowerPoint files."
      selected: true
      critical: false
      packages:
          - invictus-office
    - name: "Games"
      description: "Steam, and what Windows games need to run (Proton). Lutris for games from other stores."
      selected: false
      critical: false
      packages:
          - invictus-gaming
    - name: "Programming"
      description: "Tools for writing software: VS Code, Zed, Git, Node.js, Python and containers."
      selected: false
      critical: false
      packages:
          - invictus-dev
    - name: "Chinese, Japanese and Korean"
      description: "Fonts so web pages and documents in these languages show their characters."
      selected: false
      critical: false
      packages:
          - noto-fonts-cjk
