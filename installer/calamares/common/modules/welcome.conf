# Invictus: first page, language and the checks before anything happens.
---
showSupportUrl: false
showKnownIssuesUrl: false
showReleaseNotesUrl: false
showDonateUrl: false
requirements:
    # A full desktop plus room for snapshots (design 2.2).
    requiredStorage: 40
    # The live desktop and the installer run from memory.
    requiredRam: 3.5
    internetCheckUrl: https://archlinux.org
    check:
        - storage
        - ram
        - power
        - internet
        - root
        - screen
    # Plugged in and online are advice, not blockers: the install is offline.
    required:
        - storage
        - ram
        - root
# The language list starts on the one GeoIP suggests; the person can change it.
geoip:
    style: "json"
    url: "https://geoip.kde.org/v1/calamares"
    selector: ""
