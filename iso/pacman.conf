#
# pacman.conf used by mkarchiso to BUILD the image (not the one on it:
# that is airootfs/etc/pacman.conf). scripts/build-iso.sh replaces the
# @...@ values:
#   @BUILD_REPO_NAME@  invictus-testing (dev: what build-repo.sh makes) or
#                the published repo's name (release)
#   @REPO_DIR@   the repo folder, mounted in the build container
#   @SIGLEVEL@   "Never" for a dev build (unsigned local repo),
#                "Required DatabaseRequired" for a release build (signed;
#                the public key is added to the build container's keyring)
#
[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 5
DownloadUser = alpm
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# Ours first: pacman takes the first repo that has a package (design 1.3).
[@BUILD_REPO_NAME@]
SigLevel = @SIGLEVEL@
Server = file://@REPO_DIR@

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist
