#
# /etc/pacman.conf on Invictus (live and installed).
# Invictus packages come from our own repo, listed first so it wins over
# Arch's for the packages we pin (design 1.3). Signed: invictus-keyring
# holds the public key.
#
[options]
HoldPkg     = pacman glibc
# Custodia adds the packages that keep the computer working (invictus-guardrails;
# the file is rewritten on every guard-rails switch, design-simple-mode G4).
Include = /etc/pacman.d/invictus-guardrails.conf
Architecture = auto
Color
CheckSpace
ParallelDownloads = 5
DownloadUser = alpm
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[@REPO_NAME@]
SigLevel = Required DatabaseRequired
Server = https://github.com/turneralexander55/invictus/releases/download/@REPO_NAME@

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# Steam and the 32-bit drivers (invictus-gaming) need multilib.
[multilib]
Include = /etc/pacman.d/mirrorlist
