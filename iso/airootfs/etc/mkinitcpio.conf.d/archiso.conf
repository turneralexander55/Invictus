# Live only: archiso's boot hooks (from releng, without memdisk and the PXE
# hooks: no netboot, and their tools are not on the image) plus plymouth.
HOOKS=(base udev microcode modconf kms plymouth archiso archiso_loop_mnt block filesystems keyboard)
# zstd, not xz (2026-10-08): the kernel unpacks it several times faster; the
# level only changes the build time and the size.
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-19)
