# Invictus: for boot managers that loop-mount the ISO file with GRUB
# (https://www.supergrubdisk.org/wiki/Loopback.cfg). From archiso's releng
# profile; the entries match efiboot/loader/entries. mkarchiso fills in the
# %...% values. Ventoy's normal mode does not need this file (it boots the
# ISO's own UEFI loader); it is kept for GRUB loopback users.

# Search for the ISO volume
search --no-floppy --set=archiso_img_dev --file "${iso_path}"
probe --set archiso_img_dev_uuid --fs-uuid "${archiso_img_dev}"

default=invictus
timeout=5
timeout_style=menu

menuentry "Invictus" --class os --id 'invictus' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos archisobasedir=%INSTALL_DIR% img_dev=UUID=${archiso_img_dev_uuid} img_loop="${iso_path}" %KERNEL_PARAMS% quiet splash
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos.img
}

menuentry "Invictus, Advanced install" --class os --id 'invictus-advanced' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos archisobasedir=%INSTALL_DIR% img_dev=UUID=${archiso_img_dev_uuid} img_loop="${iso_path}" %KERNEL_PARAMS% quiet splash invictus.install=advanced
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos.img
}

menuentry "Invictus, safe graphics (installer only, messages on screen)" --class os --id 'invictus-safe' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos archisobasedir=%INSTALL_DIR% img_dev=UUID=${archiso_img_dev_uuid} img_loop="${iso_path}" %KERNEL_PARAMS% invictus.safe=1 nomodeset
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos.img
}

if [ "${grub_platform}" == 'efi' -a "${grub_cpu}" == 'x86_64' -a -f '/boot/memtest86+/memtest.efi' ]; then
    menuentry 'Memory test (Memtest86+)' --class memtest86 {
        set gfxpayload=800x600,1024x768
        linux /boot/memtest86+/memtest.efi
    }
fi

if [ "${grub_platform}" == 'efi' ]; then
    menuentry 'UEFI firmware settings' --id 'uefi-firmware' {
        fwsetup
    }
fi
