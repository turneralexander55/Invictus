<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-linecap="round">
  <title>Invictus mark, 16 px cut: three rays over the sun, one low on each side</title>
  <g stroke-width="1.5">
    <line x1="8" y1="2" x2="8" y2="4"/>
    <line x1="3.2" y1="4.2" x2="4.6" y2="5.6"/>
    <line x1="12.8" y1="4.2" x2="11.4" y2="5.6"/>
  </g>
  <!-- Side rays: flat, 1 px, on pixel row 10 so they stay sharp at 16 px -->
  <g stroke-width="1" stroke-linecap="butt">
    <line x1="1" y1="10.5" x2="3" y2="10.5"/>
    <line x1="13" y1="10.5" x2="15" y2="10.5"/>
  </g>
  <circle cx="8" cy="9.5" r="3.2" fill="currentColor" stroke="none"/>
  <line x1="1.5" y1="14" x2="14.5" y2="14" stroke-width="1.5"/>
</svg>
