<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Invictus lock screen</title><meta name="description" content="Invictus lock screen (hyprlock) mockup with the password being typed.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Cormorant+SC:wght@500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"><style>
:root{
 --night:#14120F;--basalt:#1C1A16;--stone:#27241F;--line:#3A352D;
 --marble:#ECE6DA;--parchment:#BDB4A3;--ash:#968E7F;
 --sol:#E0A64B;--sol-bright:#F0C274;--pompeii:#D9725A;--laurel:#94AD7B;
 --lapis:#7C9FD4;--verdigris:#72ACA3;--tyrian:#B388B0;--c8:#857D6F;
 --sans:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;
 --sc:"Cormorant SC",serif;--serif:"Cormorant Garamond",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0b0a08;overflow:hidden;height:100%}
body{font-family:var(--sans);color:var(--marble);-webkit-font-smoothing:antialiased}
.stage{width:1920px;height:1080px;position:relative;overflow:hidden;transform-origin:0 0;background:var(--night)}
.wall{position:absolute;inset:0;
 background:
  radial-gradient(circle at 70% 79%, #F0C274 0 58px, rgba(240,194,116,.0) 60px),
  radial-gradient(ellipse 900px 520px at 70% 80%, rgba(224,166,75,.55), rgba(160,104,44,.28) 30%, rgba(90,63,30,.18) 55%, rgba(20,18,15,0) 80%),
  linear-gradient(180deg,#14120F 0%,#17140F 45%,#2A2016 74%,#3A2A18 84%);
}
.wall::after{content:"";position:absolute;left:0;right:0;top:84%;bottom:0;
 background:linear-gradient(180deg,#1A1712 0%,#14120F 100%);border-top:1px solid rgba(224,166,75,.25)}
.glass{background:rgba(28,26,22,.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line)}
.mono{font-family:var(--mono)}
svg{display:block}
/* bar */
.bar{position:absolute;top:0;left:0;right:0;height:32px;background:rgba(20,18,15,.82);backdrop-filter:blur(18px);
 border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 8px;font-size:13px;color:var(--parchment);z-index:20}
.bar .l,.bar .r{display:flex;align-items:center;gap:4px;flex:1}
.bar .r{justify-content:flex-end}
.bar .c{position:absolute;left:50%;transform:translateX(-50%);font-weight:600;font-size:14px;color:var(--marble);font-family:var(--sans);font-variant-numeric:tabular-nums}
.m{padding:0 10px;height:24px;display:flex;align-items:center;gap:6px;border-radius:6px;position:relative}
.ws{display:flex;font-family:var(--mono)}
.ws span{width:22px;height:32px;display:flex;align-items:center;justify-content:center;color:var(--ash)}
.ws .occ{color:var(--parchment)}
.ws .act{color:var(--marble);box-shadow:inset 0 -2px var(--sol)}
.title{color:var(--ash)}
.now{color:var(--parchment)} .now b{font-weight:400;color:var(--ash)}
.dot{position:absolute;top:3px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--sol)}
/* windows */
.win{position:absolute;background:var(--night);border:2px solid var(--stone);border-radius:8px;overflow:hidden}
.win.focus{border-color:var(--sol);box-shadow:0 8px 32px rgba(0,0,0,.45)}
.win.dim::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.12)}

.blurwall{position:absolute;inset:-40px;filter:blur(24px) brightness(.55) contrast(.95)}
.center{position:absolute;left:0;right:0;text-align:center}
.clock{font-weight:300;font-size:112px;line-height:1;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.date{font-family:var(--sc);font-size:22px;letter-spacing:.18em;color:var(--parchment);margin-top:14px}
.field{width:300px;height:48px;margin:0 auto;border-radius:12px;background:rgba(28,26,22,.9);display:flex;align-items:center;justify-content:center;gap:10px;font-size:14px;color:var(--ash)}
.pw{width:9px;height:9px;border-radius:50%;background:var(--marble)}
.quote{font-family:var(--serif);font-style:italic;font-size:19px;color:var(--parchment)}
.attr{font-size:12px;color:var(--ash);margin-top:6px;letter-spacing:.02em}
</style></head>
<body><div class="stage"><div class="blurwall"><div class="wall"></div></div><div class="center" style="top:21%"><div style="display:inline-block"><svg viewBox="0 0 64 64" width="48" height="48" fill="none" stroke="currentColor" stroke-linecap="round" style="color:var(--sol)"><g stroke-width="3.5"><line x1="48.74" y1="40.95" x2="57.61" y2="42.51"/><line x1="48.42" y1="33.60" x2="57.11" y2="31.27"/><line x1="45.02" y1="27.07" x2="51.92" y2="21.29"/><line x1="39.18" y1="22.59" x2="42.99" y2="14.44"/><line x1="32" y1="21" x2="32" y2="12"/><line x1="24.82" y1="22.59" x2="21.01" y2="14.44"/><line x1="18.98" y1="27.07" x2="12.08" y2="21.29"/><line x1="15.58" y1="33.60" x2="6.89" y2="31.27"/><line x1="15.26" y1="40.95" x2="6.39" y2="42.51"/></g><circle cx="32" cy="38" r="12" fill="currentColor" stroke="none"/><line x1="6" y1="56" x2="58" y2="56" stroke-width="3.5"/></svg></div></div><div class="center" style="top:28%"><div class="clock">21:14</div><div class="date">Wednesday · 30 September</div></div><div class="center" style="top:62%"><div class="field" style="border:1px solid var(--sol)"><span class="pw"></span><span class="pw"></span><span class="pw"></span><span class="pw"></span><span class="pw"></span><span class="pw"></span><span class="pw"></span></div></div><div class="center" style="bottom:56px"><div class="quote">&ldquo;The universe is change; our life is what our thoughts make it.&rdquo;</div><div class="attr">Marcus Aurelius, Meditations IV.3</div></div></div><script>
(function(){var s=document.querySelector('.stage');function f(){var k=Math.min(1,innerWidth/1920);
s.style.transform='scale('+k+')';document.body.style.height=(1080*k)+'px'}addEventListener('resize',f);f()})();
</script></body></html>
