# the same libhyprutils/libhyprlang sonames, so leaving them to [extra]
# would let Arch move a soname under a pinned Hyprland. hyprshutdown
# (the log-out bind uses it) links libhyprtoolkit/libhyprutils, so it is
# pinned too (package audit, 2026-09-30).
