# Installed as
# /usr/lib/systemd/system/systemd-remount-fs.service.d/invictus-snapshot-overlay.conf
# (invictus-sys).
#
# A snapshot boot (limine-snapper-sync's menu, the sd-btrfs-overlayfs hook)
# runs from a read-only snapshot with a writable overlay in RAM on top, so /
# is an overlay. systemd-remount-fs runs `mount / -o remount`, and mount
# applies fstab's btrfs options for / (subvol=, compress=). The kernel's
# overlay refuses any of them on a remount ("overlay: No changes allowed in
# reconfigure"), so the unit failed and every rollback booted "degraded".
# The overlay is already read-write and needs nothing from fstab: skip the
# unit when / is an overlay. Any other boot runs it as before.
# (design.md build note 59; tests: tests/pkgs/sys.sh "remount-fs", tests/iso/disk-boot.py)
[Service]
ExecCondition=/usr/bin/sh -c '! /usr/bin/findmnt --noheadings --mountpoint / --types overlay >/dev/null'
