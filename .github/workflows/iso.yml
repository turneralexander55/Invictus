# Build the Invictus ISO (design 2.1, Phase 3). Manual only.
#
#   kind = dev      builds every package from this commit into an unsigned
#                   local repo (scripts/build-iso.sh), then the ISO. For
#                   testing; the ISO's keyring may be a throwaway (see its
#                   /etc/invictus/release).
#   kind = release  downloads the published, signed [invictus-testing] (or
#                   [invictus]) repo and builds the ISO from it, checking
#                   every signature. No private key is used here: signing
#                   stays in packages.yml's publish job.
#
# Every build runs the ISO tests first and the squashfs secrets scan
# (iso/secrets-scan.sh, design S1/T8) inside build-iso.sh; a finding fails
# the run and no ISO is uploaded. After the upload, the ISO is booted in
# QEMU with KVM (tests/iso/boot-smoke.sh): a failed or timed-out unit, or no
# installer within 10 minutes, fails the run. build-iso.sh fails an ISO of 4 GiB or more
# (a runaway build) and warns at 2 GiB. The ISO is uploaded as a workflow
# artifact whatever its size; with publish on a release build it is also
# attached to a GitHub release tagged iso-<version>, but only when it is
# under 2 GiB (GitHub's release asset limit). A bigger ISO is hosted
# elsewhere (team decision 2026-10-08) and the publish job says so and stops.
#
# Manual dispatch only works once this file is on the default branch. Until
# then, a push to the working branch that changes iso/build-request runs a
# dev build (kind and channel fall back to dev and testing).
name: iso

on:
  push:
    branches: [ccr-e2dd4715-j4vnyk]
    paths: [iso/build-request]
  workflow_dispatch:
    inputs:
      kind:
        description: 'dev (build every package, unsigned) or release (published signed repo)'
        type: choice
        options: [dev, release]
        default: dev
      channel:
        description: 'Repo the installed system uses'
        type: choice
        options: [testing, stable]
        default: testing
      publish:
        description: 'Attach the ISO to a GitHub release (release builds only)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: iso
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      KIND: ${{ inputs.kind || 'dev' }}
      CHANNEL: ${{ inputs.channel || 'testing' }}
      # Same pin as checks.yml (the runner's apt copy is 0.9.0). Bump both together.
      SHELLCHECK_VERSION: 0.11.0
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
    outputs:
      iso: ${{ steps.iso.outputs.name }}
      version: ${{ steps.iso.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space (the build needs about 20 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker image prune -af >/dev/null
          df -h /

      - name: Install shellcheck (checksum pinned)
        run: |
          curl -sSfL -o shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  shellcheck.tar.xz" | sha256sum -c -
          tar -xJf shellcheck.tar.xz --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          rm shellcheck.tar.xz
          sudo install -m755 shellcheck /usr/local/bin/shellcheck
          rm shellcheck
          shellcheck --version | grep -qx "version: ${SHELLCHECK_VERSION}"

      - name: ISO and installer tests
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq python3-yaml python3-jsonschema gnupg
          # Ubuntu 24.04 blocks unprivileged user namespaces through AppArmor;
          # tests/iso/jobs.sh needs `unshare -r` to run the install jobs as non-root.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
          tests/iso/run.sh

      - name: Download the published signed repo (release)
        if: env.KIND == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=invictus-testing
          [ "$CHANNEL" = stable ] && tag=invictus
          mkdir -p out/iso-repo
          gh release download "$tag" --dir out/iso-repo
          ls out/iso-repo | head -50

      - name: Build the ISO
        env:
          # The runner's podman is rootless and cannot mount /dev in the chroot.
          RUNTIME: docker
        run: |
          args=(--channel "$CHANNEL")
          [ "$KIND" = release ] && args+=(--release)
          scripts/build-iso.sh "${args[@]}"

      - name: Install jobs on a real btrfs disk image (limine, snapper)
        if: env.KIND == 'dev'
        run: |
          sudo modprobe btrfs loop
          docker run --rm --privileged -v "$PWD:/src:ro" -v "$PWD/out/iso-repo:/repo:ro" \
            docker.io/library/archlinux:base-devel bash /src/tests/iso/e2e-jobs.sh

      - name: Name the ISO
        id: iso
        run: |
          iso="$(cd out/iso && ls invictus-*.iso | head -n 1)"
          echo "name=$iso" >> "$GITHUB_OUTPUT"
          echo "version=$(sed -E 's/^invictus-(.*)-x86_64\.iso$/\1/' <<<"$iso")" >> "$GITHUB_OUTPUT"
          ls -l out/iso
          cat out/iso/*.sha256

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: iso
          path: out/iso
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      # After the upload, so a failing boot still leaves the ISO to look at.
      # GitHub's ubuntu-24.04 runners for public repositories expose
      # /dev/kvm; without it the step fails rather than skip.
      - name: Boot the ISO in QEMU and check for failed or timed-out units (tests/iso/boot-smoke.sh)
        env:
          RUNTIME: docker
          ISO: ${{ steps.iso.outputs.name }}
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::No /dev/kvm on this runner, so the boot smoke test cannot run."
            exit 1
          fi
          tests/iso/boot-smoke.sh "out/iso/$ISO" out/boot-smoke --timeout 600

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: boot-smoke
          path: out/boot-smoke
          if-no-files-found: ignore
          retention-days: 14

  publish:
    needs: build
    if: inputs.publish && inputs.kind == 'release'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: iso
          path: out/iso
      - name: Attach to the iso-<version> release
        env:
          GH_TOKEN: ${{ github.token }}
          ISO: ${{ needs.build.outputs.iso }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          cd out/iso
          sha256sum -c "$ISO.sha256"
          # GitHub refuses release assets of 2 GiB or more. Since 2026-10-08
          # the ISO may be bigger (less compression for a faster boot); such
          # an ISO stays a workflow artifact and is hosted elsewhere.
          size="$(stat -c %s "$ISO")"
          if [ "$size" -ge 2147483648 ]; then
            echo "::error::$ISO is $size bytes, 2 GiB or more: GitHub does not take release assets that big, so it is not attached to a release. It is hosted elsewhere (team decision 2026-10-08); get it from this run's 'iso' artifact."
            exit 1
          fi
          tag="iso-$VERSION"
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --prerelease --title "Invictus $VERSION" \
              --notes "Invictus live and install ISO $VERSION. Check it with: sha256sum -c $ISO.sha256"
          gh release upload "$tag" "$ISO" "$ISO.sha256" --clobber
