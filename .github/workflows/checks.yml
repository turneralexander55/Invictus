# Checks on every push and pull request: shell and Lua lint, the config and
# package tests, the package sets checked against Arch and the AUR,
# end-to-end signed-repo tests in Arch (including no-ai-in-base on the
# built repo, and the one-command container build), and a secrets scan
# over the full git history.
name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    env:
      # Pinned so CI and local runs use the same checks (the runner's apt
      # copy is 0.9.0 and lagged the local one). Bump both together.
      SHELLCHECK_VERSION: 0.11.0
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install shellcheck (checksum pinned)
        run: |
          curl -sSfL -o shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  shellcheck.tar.xz" | sha256sum -c -
          tar -xJf shellcheck.tar.xz --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          rm shellcheck.tar.xz
          sudo install -m755 shellcheck /usr/local/bin/shellcheck
          rm shellcheck
          shellcheck --version | grep -qx "version: ${SHELLCHECK_VERSION}"
      - name: shellcheck scripts
        # Helper scripts copied from the AUR (pkgs/aur/*/*.sh) stay as their
        # maintainers wrote them, so a bump is a plain diff; our own
        # upstream-check.sh files are checked.
        run: |
          mapfile -t files < <(git ls-files '*.sh' ':!pkgs/aur/*/*.sh'; git ls-files 'pkgs/aur/*/upstream-check.sh')
          shellcheck --version
          shellcheck -x "${files[@]}"
      - name: shellcheck PKGBUILDs
        # makepkg supplies srcdir/pkgdir and reads the metadata variables.
        run: |
          mapfile -t files < <(git ls-files '*/PKGBUILD' '*.install')
          shellcheck -s bash -e SC2034,SC2154,SC2164 "${files[@]}"

  luacheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install luacheck
        run: sudo apt-get update -q && sudo apt-get install -yq lua-check
      - run: luacheck .

  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Lua 5.4 and xkbcommon headers
        run: sudo apt-get update -q && sudo apt-get install -yq lua5.4 libxkbcommon-dev
      - name: Hyprland Lua config tests
        run: LUA=lua5.4 tests/hyprland-lua/run.sh
      - name: Package tests
        run: tests/pkgs/run.sh
      - name: Theme tests
        run: tests/theme/run.sh

  repo-e2e:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build, sign with a throwaway key, install from the repo
        run: bash tests/pkgs/e2e-arch.sh "$GITHUB_WORKSPACE"

  container-sign-e2e:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: One command, build in a container, sign on the host
        run: bash tests/pkgs/e2e-container-sign.sh "$GITHUB_WORKSPACE"

  packages-live:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Package sets against Arch and the AUR today
        run: bash tests/pkgs/live-arch.sh "$GITHUB_WORKSPACE"

  adopt-e2e:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Adopt a fake legacy machine, check, undo
        run: bash tests/pkgs/e2e-adopt.sh "$GITHUB_WORKSPACE"

  gitleaks:
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every commit on every branch, not just the tip
      - name: Install gitleaks (checksum pinned)
        run: |
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          rm gitleaks.tgz
      - name: Scan the full history
        run: ./gitleaks git --redact --verbose --exit-code 1 .
