# Build pkgs/ into the [invictus-testing] pacman repo and publish it as the
# assets of the GitHub release tagged invictus-testing. pacman then uses:
#
#   [invictus-testing]
#   Server = https://github.com/turneralexander55/invictus/releases/download/invictus-testing
#
# The signing key never shares a job with package build code:
#   build           runs the PKGBUILDs in an Arch container. No secrets.
#   no-ai-in-base   design-no-ai.md NA3: no non-AI set pulls the AI set, in
#                   the built repo. Publishing waits for it.
#   publish         signs, indexes with repo-add, uploads. Runs no PKGBUILD
#                   code.
# Size and time: proton-ge-custom-bin is about 500 MB (GitHub's limit is
# 2 GiB per asset; build-repo.sh refuses bigger). A package is rebuilt and
# uploaded only when its file name is new (pkgver or pkgrel changed); the
# build job downloads the published set first so unchanged ones are reused,
# and publish uploads only files the release does not have yet.
# Signing uses the REPO_SIGNING_KEY and REPO_SIGNING_PASSPHRASE secrets
# (docs/checklists/signing-key.md). Without them the repo is published
# unsigned, with a warning on the run.
name: packages

on:
  push:
    # The 0.2 work branch publishes too until it merges into main: packages.yml
    # is not on main yet, so it cannot be started by hand (Alex, 2026-10-09).
    branches: [main, ccr-e2dd4715-j4vnyk]
    # Own packages install files from these folders (see each PKGBUILD).
    paths:
      - 'pkgs/**'
      - 'scripts/**'
      - 'config/**'
      - 'theme/**'
      - 'assets/wallpapers/**'
      - 'docs/brand/**'
      - 'tests/hyprland-lua/*.lua'
      - '.github/workflows/packages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packages
  cancel-in-progress: false

env:
  TAG: invictus-testing

jobs:
  build:
    runs-on: ubuntu-24.04
    # A cold build (every AUR pin, calamares and the limine native images
    # included) took about 15 minutes on 4 cores.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch the published packages (reused when unchanged)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out/repo
          # A failed download must fail the job: rebuilding a published
          # version gives new bytes under the same file name, which breaks
          # machines that have the old file in their pacman cache.
          n=0
          if gh release view "$TAG" >/dev/null 2>&1; then
            n=$(gh release view "$TAG" --json assets --jq '[.assets[].name | select(test("\\.pkg\\.tar\\.zst"))] | length')
          fi
          if [ "$n" -gt 0 ]; then
            gh release download "$TAG" --dir out/repo --pattern '*.pkg.tar.zst*'
          else
            echo "No published packages yet: building everything."
          fi
          ls -l out/repo
      - name: Build in archlinux:base-devel
        run: scripts/build-repo.sh --in-container --build-only --out out/repo
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repo
          path: out/repo
          if-no-files-found: error
          retention-days: 7

  no-ai-in-base:
    needs: build
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: repo
          path: out/repo
      - name: Index unsigned (resolution only; publish signs)
        run: bash scripts/build-repo.sh --no-container --repo-only --out out/repo
      - name: No non-AI set pulls the AI set (NA3)
        run: bash tests/pkgs/no-ai-in-base.sh out/repo

  publish:
    needs: [build, no-ai-in-base]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: repo
          path: out/repo
      - name: Sign and index
        env:
          INVICTUS_SIGNING_KEY: ${{ secrets.REPO_SIGNING_KEY }}
          INVICTUS_SIGNING_PASSPHRASE: ${{ secrets.REPO_SIGNING_PASSPHRASE }}
        run: |
          if [ -z "$INVICTUS_SIGNING_KEY" ]; then
            echo "::warning title=Unsigned repo::REPO_SIGNING_KEY is not set, so packages and the database are published UNSIGNED. pacman refuses them with its default SigLevel. Steps: docs/checklists/signing-key.md"
          fi
          scripts/build-repo.sh --in-container --repo-only --out out/repo
      - name: Publish to the invictus-testing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out/repo
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --prerelease --target "$GITHUB_SHA" \
              --title "[invictus-testing] package repo" \
              --notes "pacman repo for Alex's machine. Server = https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          fi
          # Packages first, databases last, so a client never sees a database
          # that names a package not uploaded yet. A package file already on
          # the release has the same bytes (a new build always has a new
          # name), so only new ones go up; signatures and databases always.
          shopt -s nullglob
          pkgs=(*.pkg.tar.zst *.pkg.tar.zst.sig)
          dbs=(invictus-testing.db* invictus-testing.files*)
          gh release view "$TAG" --json assets --jq '.assets[].name' | sort > /tmp/before.txt
          upload=()
          for f in "${pkgs[@]}"; do
            if [[ "$f" == *.sig ]] || ! grep -qxF "$f" /tmp/before.txt; then upload+=("$f"); fi
          done
          echo "Uploading ${#upload[@]} package files; $(( ${#pkgs[@]} - ${#upload[@]} )) already published"
          if [ ${#upload[@]} -gt 0 ]; then gh release upload "$TAG" --clobber "${upload[@]}"; fi
          gh release upload "$TAG" --clobber "${dbs[@]}"
          # pacman downloads the exact file names in the database. GitHub
          # renames assets with unusual characters, so check every name
          # arrived unchanged (build-repo.sh keeps names to [A-Za-z0-9._-]).
          gh release view "$TAG" --json assets --jq '.assets[].name' | sort > /tmp/assets.txt
          missing=0
          for f in "${pkgs[@]}" "${dbs[@]}"; do
            grep -qxF "$f" /tmp/assets.txt || { echo "::error::asset $f is not on the release under that name"; missing=1; }
          done
          [ "$missing" = 0 ]
          # Remove assets that are no longer part of the repo.
          gh release view "$TAG" --json assets --jq '.assets[].name' | while read -r asset; do
            if [ ! -e "$asset" ]; then
              echo "Removing stale asset $asset"
              gh release delete-asset "$TAG" "$asset" --yes
            fi
          done
          echo "Published: $(find . -maxdepth 1 -type f | wc -l) files"
