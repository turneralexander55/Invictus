# Showcase (default): the original kitty cursor animation, unchanged.

# 1 second cycle: 0.5 s fade out, 0.5 s fade in, blinking forever
cursor_blink_interval 0.5 ease-in-out
cursor_stop_blinking_after 0

# Trail for cursor jumps after a pause: fast, then slow decay
cursor_trail 50
cursor_trail_decay 0.12 0.45

# Require meaningful movement before the trail starts
cursor_trail_start_threshold 2

# Use the cursor background colour
cursor_trail_color none
