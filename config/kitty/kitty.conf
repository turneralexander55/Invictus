# Font
font_family      IBM Plex Mono
bold_font        auto
italic_font      auto
font_size        12.5

# Line spacing
modify_font cell_height 110%

# Solid background: text stays fully legible
background_opacity 1.0

window_padding_width 10 14

# Prevent shell from forcing beam cursor
shell_integration no-cursor

# === Cursor ===
cursor_shape block


# === Tabs ===
# Shown from two tabs up. Colours come from the theme file below.
tab_bar_style separator
tab_separator " · "
tab_bar_edge top
tab_bar_min_tabs 2

url_style single


# === Colours ===
# Never typed here. colors-fallback.conf is Dusk; the current theme's file
# loads after it and wins. invictus-theme reloads every window with SIGUSR1.
include colors-fallback.conf
globinclude ~/.config/invictus/current/kitty-colors.conf


# === Cursor motion ===
# Blink and trail come from the motion level (~/.config/invictus/motion):
# motion/showcase.conf (the default, Alex's original values), motion/calm.conf,
# motion/off.conf. The motion switcher links
# ~/.config/invictus/motion.d/kitty.conf at the level's file, which is loaded
# last and wins; with no link, Showcase applies.
include motion/showcase.conf
globinclude ~/.config/invictus/motion.d/kitty.conf
