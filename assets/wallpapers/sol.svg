<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1730" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#14120F"/><stop offset=".5" stop-color="#16130F"/><stop offset=".8" stop-color="#241B12"/><stop offset="1" stop-color="#3B2A17"/></linearGradient>
<radialGradient id="glow" cx="2688" cy="1662" r="1500" gradientUnits="userSpaceOnUse" gradientTransform="translate(2688 1662) scale(1 .5) translate(-2688 -1662)"><stop offset="0" stop-color="#E0A64B" stop-opacity=".42"/><stop offset=".3" stop-color="#A0682C" stop-opacity=".16"/><stop offset="1" stop-color="#14120F" stop-opacity="0"/></radialGradient>
<radialGradient id="halo" cx="2688" cy="1622" r="300" gradientUnits="userSpaceOnUse"><stop offset=".3" stop-color="#F0C274" stop-opacity=".35"/><stop offset="1" stop-color="#F0C274" stop-opacity="0"/></radialGradient>
