<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160" preserveAspectRatio="xMidYMax slice">
<title>Sol</title>
<desc>A low sun over a horizon at dusk, nine faint rays, for the Dusk theme. Invictus default wallpaper by Alex. CC BY 4.0: https://creativecommons.org/licenses/by/4.0/ (see LICENSE.md).</desc>
