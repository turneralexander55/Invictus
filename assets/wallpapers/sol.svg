<radialGradient id="refl" cx="2688" cy="1730" r="420" gradientUnits="userSpaceOnUse" gradientTransform="translate(2688 1730) scale(.32 1) translate(-2688 -1730)"><stop offset="0" stop-color="#E0A64B" stop-opacity=".16"/><stop offset="1" stop-color="#E0A64B" stop-opacity="0"/></radialGradient>
<filter id="soft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="22"/></filter>
